<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jim Crow Laws Database</title>
    <!-- React CDN -->
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            background-color: #f8f9fa;
        }
        .search-card {
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
        }
        .result-card {
            transition: box-shadow 0.2s;
        }
        .result-card:hover {
            box-shadow: 0 0.25rem 0.5rem rgba(0, 0, 0, 0.15);
        }
        .law-text {
            background-color: #f8f9fa;
            border-left: 4px solid #007bff;
            padding: 1rem;
            font-family: 'Georgia', serif;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }
        .chat-log {
            min-height: 320px;
            max-height: 60vh;
            overflow-y: auto;
        }
        .chat-msg-user {
            background-color: #e7f1ff;
            border-radius: 0.75rem 0.75rem 0 0.75rem;
            margin-left: auto;
            max-width: 80%;
        }
        .chat-msg-assistant {
            background-color: #ffffff;
            border: 1px solid #dee2e6;
            border-radius: 0.75rem 0.75rem 0.75rem 0;
            max-width: 90%;
        }
        .chat-msg-assistant p:last-child { margin-bottom: 0; }
        .cite-link {
            font-size: 0.75em;
            vertical-align: super;
            text-decoration: none;
            padding: 0 0.1rem;
        }
        .source-card.highlight {
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.35);
        }
        .source-snippet {
            font-family: 'Georgia', serif;
            font-size: 0.875rem;
            background-color: #f8f9fa;
            border-left: 3px solid #6c757d;
            padding: 0.5rem 0.75rem;
        }
        @media (max-width: 576px) {
            .chat-log { padding: 0.5rem !important; }
            .chat-msg-user, .chat-msg-assistant { max-width: 100%; }
            .chat-msg-assistant { padding: 0.75rem !important; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // The API runs on port 5000; the page may also be served by server.py on 8000.
        const API_BASE = window.location.port === '5000' ? '' : 'http://localhost:5000';

        function SearchView() {
            const [searchResults, setSearchResults] = useState([]);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');

            // Search filters
            const [keyword, setKeyword] = useState('');
            const [yearFrom, setYearFrom] = useState('1865');
            const [yearTo, setYearTo] = useState('1965');
            const [category, setCategory] = useState('all');

            // Pagination
            const [page, setPage] = useState(1);
            const [totalPages, setTotalPages] = useState(1);
            const [totalCount, setTotalCount] = useState(0);
            const LIMIT = 50;

            // Dynamic categories and keywords fetched from the database
            const [categories, setCategories] = useState([]);
            const [allKeywords, setAllKeywords] = useState([]);

            // Fetch available categories and keywords on load
            useEffect(() => {
                fetch(`${API_BASE}/categories`)
                    .then(r => r.json())
                    .then(data => setCategories(data.categories || []))
                    .catch(() => {});
                fetch(`${API_BASE}/keywords`)
                    .then(r => r.json())
                    .then(data => setAllKeywords(data.keywords || []))
                    .catch(() => {});
            }, []);

            // Search function — accepts an explicit page number
            const handleSearch = async (pageNum = 1) => {
                setLoading(true);
                setError('');
                setPage(pageNum);

                try {
                    const params = new URLSearchParams();
                    if (keyword) params.append('keyword', keyword);
                    if (category !== 'all') params.append('category', category);
                    if (yearFrom) params.append('year_from', yearFrom);
                    if (yearTo) params.append('year_to', yearTo);
                    params.append('page', pageNum);
                    params.append('limit', LIMIT);

                    const response = await fetch(`${API_BASE}/search?${params.toString()}`);
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                    const data = await response.json();
                    setSearchResults(data.laws || []);
                    setTotalPages(data.total_pages || 1);
                    setTotalCount(data.total || 0);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } catch (err) {
                    setError('Error connecting to database. Please ensure the server is running.');
                    console.error('Search error:', err);
                    setSearchResults([]);
                } finally {
                    setLoading(false);
                }
            };

            // New search always resets to page 1
            const handleNewSearch = () => handleSearch(1);

            // Initial search
            useEffect(() => {
                handleSearch(1);
            }, []);

            return (
                <div>
                    {/* Search Filters */}
                    <div className="row mb-4">
                        <div className="col">
                            <div className="card search-card">
                                <div className="card-body">
                                    <h5 className="card-title">Search Filters</h5>
                                    <form onSubmit={(e) => { e.preventDefault(); handleNewSearch(); }}>
                                        <div className="row mb-3">
                                            <div className="col-md-6">
                                                <label className="form-label">Keyword Search</label>
                                                <input
                                                    type="text"
                                                    className="form-control"
                                                    list="keyword-suggestions"
                                                    placeholder="Search in titles, content, or keywords..."
                                                    value={keyword}
                                                    onChange={(e) => setKeyword(e.target.value)}
                                                />
                                                <datalist id="keyword-suggestions">
                                                    {allKeywords.map(kw => (
                                                        <option key={kw} value={kw} />
                                                    ))}
                                                </datalist>
                                                <div className="form-text">
                                                    Search across law titles, content, summaries, and keywords
                                                </div>
                                            </div>
                                            <div className="col-md-6">
                                                <label className="form-label">Law Category</label>
                                                <select
                                                    className="form-select"
                                                    value={category}
                                                    onChange={(e) => setCategory(e.target.value)}
                                                >
                                                    <option value="all">All Categories</option>
                                                    {categories.map((cat) => (
                                                        <option key={cat} value={cat}>
                                                            {cat.charAt(0).toUpperCase() + cat.slice(1)}
                                                        </option>
                                                    ))}
                                                </select>
                                            </div>
                                        </div>
                                        
                                        <div className="row mb-3">
                                            <div className="col-md-3">
                                                <label className="form-label">Year From</label>
                                                <input
                                                    type="number"
                                                    className="form-control"
                                                    min="1865"
                                                    max="1965"
                                                    value={yearFrom}
                                                    onChange={(e) => setYearFrom(e.target.value)}
                                                />
                                            </div>
                                            <div className="col-md-3">
                                                <label className="form-label">Year To</label>
                                                <input
                                                    type="number"
                                                    className="form-control"
                                                    min="1865"
                                                    max="1965"
                                                    value={yearTo}
                                                    onChange={(e) => setYearTo(e.target.value)}
                                                />
                                            </div>
                                            <div className="col-md-6 d-flex align-items-end">
                                                <div className="d-grid gap-2 d-md-flex w-100">
                                                    <button 
                                                        type="submit" 
                                                        className="btn btn-primary flex-fill"
                                                        disabled={loading}
                                                    >
                                                        {loading ? 'Searching...' : 'Search'}
                                                    </button>
                                                    <button 
                                                        type="button" 
                                                        className="btn btn-outline-secondary"
                                                        onClick={() => {
                                                            setKeyword('');
                                                            setYearFrom('1865');
                                                            setYearTo('1965');
                                                            setCategory('all');
                                                            setTimeout(handleSearch, 100);
                                                        }}
                                                    >
                                                        Clear
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Error Message */}
                    {error && (
                        <div className="row mb-3">
                            <div className="col">
                                <div className="alert alert-danger">{error}</div>
                            </div>
                        </div>
                    )}

                    {/* Search Results */}
                    <div className="row">
                        <div className="col">
                            <h5>Search Results ({totalCount.toLocaleString()} laws found — page {page} of {totalPages})</h5>
                            
                            {loading ? (
                                <div className="text-center py-5">
                                    <div className="spinner-border" role="status">
                                        <span className="visually-hidden">Loading...</span>
                                    </div>
                                    <p className="mt-2">Searching...</p>
                                </div>
                            ) : searchResults.length === 0 ? (
                                <div className="card">
                                    <div className="card-body text-center py-5">
                                        <h6>No laws found</h6>
                                        <p className="text-muted">
                                            Try adjusting your search filters or keywords to find relevant legislation.
                                        </p>
                                    </div>
                                </div>
                            ) : (
                                searchResults.map((law) => (
                                    <div key={law.id} className="card mb-3 result-card">
                                        <div className="card-body">
                                            <div className="row">
                                                <div className="col">
                                                    <h6 className="card-title">{law.title}</h6>
                                                    
                                                    <div className="mb-2">
                                                        <small className="text-muted">
                                                            <strong>Year:</strong> {law.year} | 
                                                            <strong> Citation:</strong> {law.citation}
                                                        </small>
                                                    </div>

                                                    <div className="mb-2">
                                                        <span className="badge bg-secondary me-1">
                                                            {law.category.charAt(0).toUpperCase() + law.category.slice(1)}
                                                        </span>
                                                    </div>

                                                    <div className="card-text mb-3">
                                                        {law.summary}
                                                    </div>

                                                    {law.keywords && (
                                                        <div className="mb-2">
                                                            <small className="text-muted">
                                                                <strong>Keywords:</strong> {law.keywords.join(', ')}
                                                            </small>
                                                        </div>
                                                    )}

                                                    {law.ocr_text && (
                                                        <div className="law-text">
                                                            {law.ocr_text}
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                ))
                            )}

                            {/* Pagination Controls */}
                            {totalPages > 1 && !loading && (
                                <div className="d-flex justify-content-center align-items-center gap-2 mt-4 mb-4 flex-wrap">
                                    <button
                                        className="btn btn-outline-primary"
                                        disabled={page === 1}
                                        onClick={() => handleSearch(1)}
                                    >« First</button>
                                    <button
                                        className="btn btn-outline-primary"
                                        disabled={page === 1}
                                        onClick={() => handleSearch(page - 1)}
                                    >‹ Prev</button>

                                    {/* Page number buttons — show up to 7 around current page */}
                                    {Array.from({ length: totalPages }, (_, i) => i + 1)
                                        .filter(p => p === 1 || p === totalPages || Math.abs(p - page) <= 3)
                                        .reduce((acc, p, idx, arr) => {
                                            if (idx > 0 && p - arr[idx - 1] > 1) acc.push('...');
                                            acc.push(p);
                                            return acc;
                                        }, [])
                                        .map((p, idx) =>
                                            p === '...' ? (
                                                <span key={`ellipsis-${idx}`} className="px-2 text-muted">…</span>
                                            ) : (
                                                <button
                                                    key={p}
                                                    className={`btn ${p === page ? 'btn-primary' : 'btn-outline-secondary'}`}
                                                    onClick={() => handleSearch(p)}
                                                >{p}</button>
                                            )
                                        )
                                    }

                                    <button
                                        className="btn btn-outline-primary"
                                        disabled={page === totalPages}
                                        onClick={() => handleSearch(page + 1)}
                                    >Next ›</button>
                                    <button
                                        className="btn btn-outline-primary"
                                        disabled={page === totalPages}
                                        onClick={() => handleSearch(totalPages)}
                                    >Last »</button>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const EXAMPLE_QUESTIONS = [
            'What did the Day Law of 1904 do?',
            'Which laws required separate railroad coaches?',
            'Were there laws against interracial marriage before 1900?',
            'How many school segregation laws are in the archive from the 1890s?',
        ];

        // Render the assistant's text: paragraphs, "- " bullets, **bold**, and [n] citations.
        function AnswerText({ text, onCite }) {
            const inline = (line, key) => line.split(/(\[\d+\]|\*\*[^*]+\*\*)/g).map((part, i) => {
                const cite = part.match(/^\[(\d+)\]$/);
                if (cite) {
                    return (
                        <a key={`${key}-${i}`} href="#" className="cite-link"
                           onClick={(e) => { e.preventDefault(); onCite(Number(cite[1])); }}>[{cite[1]}]</a>
                    );
                }
                const bold = part.match(/^\*\*([^*]+)\*\*$/);
                if (bold) return <strong key={`${key}-${i}`}>{bold[1]}</strong>;
                return <React.Fragment key={`${key}-${i}`}>{part}</React.Fragment>;
            });
            const blocks = text.split(/\n\s*\n/);
            return blocks.map((block, b) => {
                const lines = block.split('\n').filter(l => l.trim());
                if (lines.length && lines.every(l => /^\s*[-*•]\s+/.test(l))) {
                    return (
                        <ul key={b} className="mb-2">
                            {lines.map((l, i) => <li key={i}>{inline(l.replace(/^\s*[-*•]\s+/, ''), `${b}-${i}`)}</li>)}
                        </ul>
                    );
                }
                return <p key={b} className="mb-2">{lines.map((l, i) => (
                    <React.Fragment key={i}>{i > 0 && <br />}{inline(l, `${b}-${i}`)}</React.Fragment>
                ))}</p>;
            });
        }

        function SourceCard({ source, highlighted, cardRef }) {
            const [open, setOpen] = useState(false);
            return (
                <div ref={cardRef} className={`card mb-2 source-card ${highlighted ? 'highlight' : ''}`}>
                    <div className="card-body py-2 px-3">
                        <div className="d-flex flex-wrap justify-content-between align-items-start gap-1">
                            <div>
                                <span className="badge bg-primary me-2">{source.number}</span>
                                <strong className="small">{source.citation}</strong>
                            </div>
                            <div>
                                {source.category && <span className="badge bg-secondary me-1">{source.category.replace(/_/g, ' ')}</span>}
                                {source.needs_review
                                    ? <span className="badge bg-warning text-dark">Needs review</span>
                                    : <span className="badge bg-success">Reviewed</span>}
                            </div>
                        </div>
                        <div className="small mt-1">{source.title}</div>
                        <div className="small text-muted">
                            Printed {source.years}{source.printings > 1 ? ` · ${source.printings} printings` : ''}
                        </div>
                        <button className="btn btn-link btn-sm p-0" onClick={() => setOpen(!open)}>
                            {open ? 'Hide text' : 'Show text'}
                        </button>
                        {open && (
                            <div className="mt-2">
                                <div className="source-snippet mb-2">{source.snippet}</div>
                                {source.summary && <div className="small text-muted mb-1"><strong>AI page summary:</strong> {source.summary}</div>}
                                {source.printed_in && source.printed_in.length > 1 && (
                                    <div className="small text-muted"><strong>Printed in:</strong> {source.printed_in.join('; ')}</div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function AssistantMessage({ message }) {
            const [highlight, setHighlight] = useState(null);
            const [showAll, setShowAll] = useState(false);
            const refs = useRef({});
            const sources = message.sources || [];
            const cited = sources.filter(s => s.cited);
            const shown = showAll || cited.length === 0 ? sources : cited;
            const onCite = (n) => {
                if (!shown.some(s => s.number === n)) setShowAll(true);
                setHighlight(n);
                setTimeout(() => refs.current[n] && refs.current[n].scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 50);
            };
            return (
                <div className="chat-msg-assistant p-3 mb-3">
                    <AnswerText text={message.content} onCite={onCite} />
                    {sources.length > 0 && (
                        <div className="mt-3">
                            <div className="d-flex justify-content-between align-items-center mb-2">
                                <small className="text-muted fw-bold">
                                    {cited.length > 0 && !showAll ? `Sources cited (${cited.length})` : `Matching statutes (${sources.length})`}
                                </small>
                                {cited.length > 0 && cited.length < sources.length && (
                                    <button className="btn btn-link btn-sm p-0" onClick={() => setShowAll(!showAll)}>
                                        {showAll ? 'Show cited only' : `Show all ${sources.length}`}
                                    </button>
                                )}
                            </div>
                            {shown.map(s => (
                                <SourceCard key={s.number} source={s} highlighted={highlight === s.number}
                                            cardRef={el => { refs.current[s.number] = el; }} />
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        function ChatView() {
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState('');
            const [sending, setSending] = useState(false);
            const [error, setError] = useState('');
            const logRef = useRef(null);

            useEffect(() => {
                if (logRef.current) logRef.current.scrollTop = logRef.current.scrollHeight;
            }, [messages, sending]);

            const send = async (text) => {
                const question = (text || input).trim();
                if (!question || sending) return;
                const history = messages.map(m => ({ role: m.role, content: m.content }));
                setMessages(prev => [...prev, { role: 'user', content: question }]);
                setInput('');
                setSending(true);
                setError('');
                try {
                    const response = await fetch(`${API_BASE}/chat`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: question, history }),
                    });
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
                    setMessages(prev => [...prev, { role: 'assistant', content: data.answer, sources: data.sources }]);
                } catch (err) {
                    setError(`The assistant could not answer: ${err.message}. Please ensure the server is running.`);
                } finally {
                    setSending(false);
                }
            };

            return (
                <div className="card search-card">
                    <div className="card-body">
                        <div className="d-flex justify-content-between align-items-center mb-2">
                            <h5 className="card-title mb-0">Ask the Archive</h5>
                            {messages.length > 0 && (
                                <button className="btn btn-outline-secondary btn-sm" onClick={() => { setMessages([]); setError(''); }}>
                                    New conversation
                                </button>
                            )}
                        </div>
                        <p className="small text-muted">
                            Answers come only from the laws in this archive and cite them. They are drawn from OCR'd
                            statute books and AI classification, so check the cited text before relying on an answer.
                        </p>

                        <div ref={logRef} className="chat-log border rounded p-3 mb-3 bg-light">
                            {messages.length === 0 && !sending && (
                                <div className="text-center text-muted py-4">
                                    <p className="mb-3">Ask about Kentucky's Jim Crow laws, for example:</p>
                                    <div className="d-flex flex-wrap justify-content-center gap-2">
                                        {EXAMPLE_QUESTIONS.map(q => (
                                            <button key={q} className="btn btn-outline-primary btn-sm" onClick={() => send(q)}>{q}</button>
                                        ))}
                                    </div>
                                </div>
                            )}
                            {messages.map((m, i) => m.role === 'user'
                                ? <div key={i} className="chat-msg-user p-2 px-3 mb-3">{m.content}</div>
                                : <AssistantMessage key={i} message={m} />
                            )}
                            {sending && (
                                <div className="text-muted small">
                                    <span className="spinner-border spinner-border-sm me-2" role="status"></span>
                                    Searching the archive…
                                </div>
                            )}
                        </div>

                        {error && <div className="alert alert-danger py-2">{error}</div>}

                        <form onSubmit={(e) => { e.preventDefault(); send(); }}>
                            <div className="input-group">
                                <input
                                    type="text"
                                    className="form-control"
                                    placeholder="Ask a question about the laws…"
                                    value={input}
                                    maxLength={2000}
                                    onChange={(e) => setInput(e.target.value)}
                                    disabled={sending}
                                />
                                <button type="submit" className="btn btn-primary" disabled={sending || !input.trim()}>
                                    Ask
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        function App() {
            const [tab, setTab] = useState('search');
            return (
                <div className="container py-4">
                    <div className="row mb-4">
                        <div className="col text-center">
                            <h1 className="display-5">Jim Crow Laws Database</h1>
                            <p className="lead text-muted">
                                Search and explore historical Jim Crow laws from Kentucky (1865-1965)
                            </p>
                        </div>
                    </div>
                    <ul className="nav nav-tabs mb-4">
                        <li className="nav-item">
                            <button className={`nav-link ${tab === 'search' ? 'active' : ''}`} onClick={() => setTab('search')}>
                                Search
                            </button>
                        </li>
                        <li className="nav-item">
                            <button className={`nav-link ${tab === 'chat' ? 'active' : ''}`} onClick={() => setTab('chat')}>
                                Ask the Archive
                            </button>
                        </li>
                    </ul>
                    {/* Both stay mounted so switching tabs keeps search results and the conversation. */}
                    <div style={{ display: tab === 'search' ? 'block' : 'none' }}><SearchView /></div>
                    <div style={{ display: tab === 'chat' ? 'block' : 'none' }}><ChatView /></div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
